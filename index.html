<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Plantas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1 id="titulo">Mis Plantas</h1>
        <p id="resumen"></p>
    </header>

    <p id="estadisticas"></p>

    <section class="leyenda-colores" aria-labelledby="titulo-leyenda">
        <h2 id="titulo-leyenda">Leyenda de colores</h2>
        <ul>
            <li><span class="indicador-color saludable" aria-hidden="true"></span> Verde: planta saludable</li>
            <li><span class="indicador-color necesita-agua" aria-hidden="true"></span> Naranja: necesita agua</li>
            <li><span class="indicador-color necesita-cuidados" aria-hidden="true"></span> Rojo: necesita cuidados</li>
        </ul>
    </section>

    <section>
        <input id="buscador" type="search" placeholder="Buscar planta...">
        <button id="ordenNombre">Ordenar A-Z</button>
        <button id="ordenNumero">Ordenar por altura</button>
    </section>

    <main id="listado"></main>

    <script src="js/app.js" defer></script>
</body>
</html>
