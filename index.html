<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Plantas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1 id="titulo">Mis Plantas</h1>
        <p id="resumen"></p>
    </header>
   
    <p id="estadisticas"></p>

    <section class="controles" aria-label="Buscar y ordenar plantas">
        <label for="buscador">Buscar plantas</label>
        <input id="buscador" type="search" placeholder="Nombre, especie, ubicación o estado">
        <div class="ordenes" aria-label="Ordenar plantas">
            <button type="button" data-criterio="original" aria-pressed="true">Orden original</button>
            <button type="button" data-criterio="nombre" aria-pressed="false">Nombre A-Z</button>
            <button type="button" data-criterio="alturaAsc" aria-pressed="false">Altura menor a mayor</button>
            <button type="button" data-criterio="alturaDesc" aria-pressed="false">Altura mayor a menor</button>
        </div>
    </section>
   
    <main id="listado"></main>

    <script src="js/app.js" defer></script>
</body>
</html>
