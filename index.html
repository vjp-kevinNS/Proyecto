<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173c30" />
    <title>Mis Plantas</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header class="cabecera">
      <div class="contenedor barra">
        <a class="marca" href="#inicio"><span aria-hidden="true"></span> Mis Plantas</a>
        <nav aria-label="Navegación principal">
          <a href="#inicio">Inicio</a>
          <a href="#coleccion">Colección</a>
          <a href="#anadir-planta">Añadir planta</a>
        </nav>
      </div>
    </header>

    <main class="contenedor">
      <div class="vista" data-vista="inicio">
        <section class="portada" aria-labelledby="titulo">
          <div class="portada-texto">
            <h1 id="titulo" tabindex="-1">Mi jardín<br />en casa</h1>
            <p>Organiza tu colección y lleva al día el cuidado de tus plantas.</p>
            <div class="acciones-portada">
              <a class="boton portada-boton" href="#coleccion">Ver colección</a>
              <a class="boton portada-secundaria" href="#anadir-planta">+ Añadir planta</a>
            </div>
          </div>
          <div class="ilustracion" aria-hidden="true">
            <span class="tallo"></span>
            <span class="hoja hoja-1"></span>
            <span class="hoja hoja-2"></span>
            <span class="hoja hoja-3"></span>
            <span class="hoja hoja-4"></span>
            <span class="hoja hoja-5"></span>
          </div>
        </section>

        <section class="estadisticas" aria-labelledby="titulo-estadisticas">
          <h2 id="titulo-estadisticas">Tu jardín en cifras</h2>
          <ul id="estadisticas" class="panel"></ul>
        </section>
      </div>

      <section class="vista vista-interior" data-vista="coleccion" aria-labelledby="titulo-coleccion" hidden>
        <div class="encabezado-vista">
          <h1 id="titulo-coleccion" tabindex="-1">Colección</h1>
          <a class="boton" href="#anadir-planta">+ Añadir planta</a>
        </div>
        <div class="controles">
          <label for="buscador">Buscar plantas</label>
          <input id="buscador" type="search" placeholder="Nombre, especie, ubicación o estado" />
          <div class="ordenes" role="group" aria-label="Ordenar plantas">
            <button id="ordenNombre" type="button" aria-pressed="false">A–Z</button>
            <button id="ordenNumero" type="button" aria-pressed="false">Altura</button>
            <button id="ordenFecha" type="button" aria-pressed="false">Más recientes</button>
          </div>
        </div>
        <p id="resumen" role="status"></p>
        <div id="listado"></div>
      </section>

      <section id="formulario-plantas" class="vista vista-interior" data-vista="anadir-planta" aria-labelledby="titulo-formulario" hidden>
        <h1 id="titulo-formulario" tabindex="-1">Añadir planta</h1>
        <form id="formulario">
          <div class="campo">
            <label for="nombrePlanta">Nombre</label>
            <input type="text" id="nombrePlanta" placeholder="Ej. Monstera" required />
          </div>
          <div class="campo">
            <label for="especiePlanta">Especie</label>
            <input type="text" id="especiePlanta" placeholder="Ej. Monstera deliciosa" required />
          </div>
          <div class="campo">
            <label for="fechaPlanta">Fecha de adquisición</label>
            <input type="date" id="fechaPlanta" required />
          </div>
          <div class="campo">
            <label for="alturaPlanta">Altura (cm)</label>
            <input type="number" id="alturaPlanta" min="0" required />
          </div>
          <div class="campo">
            <label for="ubicacionPlanta">Ubicación</label>
            <input type="text" id="ubicacionPlanta" placeholder="Ej. Salón" required />
          </div>
          <div class="campo">
            <label for="estadoPlanta">Estado</label>
            <select id="estadoPlanta" required>
              <option value="Saludable">Saludable</option>
              <option value="Necesita agua">Necesita agua</option>
              <option value="Necesita cuidados">Necesita cuidados</option>
            </select>
          </div>
          <div class="acciones-formulario">
            <button class="boton" type="submit">Añadir a la colección</button>
            <a href="#coleccion">Ver colección</a>
          </div>
          <p id="avisoFormulario" role="status"></p>
        </form>
      </section>
      <noscript><p>Activa JavaScript para consultar y editar la colección.</p></noscript>
    </main>
    <script type="module" src="js/interfaz.js"></script>
  </body>
</html>
